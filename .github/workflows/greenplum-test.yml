# =============================================================================
# Greenplum Integration Tests
# MySQL → Greenplum 6 (2-node cluster) 迁移测试
# =============================================================================

name: MySQL → Greenplum 6 迁移测试 (5.7/8.0)

on:
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  MYSQL_VERSION: '8.0'
  GREENPLUM_IMAGE: 'andrewjw/docker-greenplum:latest'
  GP_MASTER_CONTAINER: 'gp_master'
  GPADMIN_USER: 'gpadmin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # =============================================================================
  # MySQL → Greenplum 6 迁移测试 (矩阵：5.7 和 8.0)
  # =============================================================================
  integration-test-greenplum:
    name: MySQL ${{ matrix.mysql_version }} → Greenplum (1 Master + 1 Segment)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mysql_version: ['5.7', '8.0']
      fail-fast: false

    # 增加超时时间（Greenplum 启动较慢）
    timeout-minutes: 60

    # MySQL 服务
    services:
      mysql:
        image: mysql:${{ matrix.mysql_version }}
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    
    steps:
      # -------------------------------------------------------------------------
      # 1. 代码检出
      # -------------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
      
      # -------------------------------------------------------------------------
      # 2. Go 环境设置
      # -------------------------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      # -------------------------------------------------------------------------
      # 3. 安装客户端工具
      # -------------------------------------------------------------------------
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
      
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      # -------------------------------------------------------------------------
      # 4. 等待 MySQL 就绪
      # -------------------------------------------------------------------------
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
      
      # -------------------------------------------------------------------------
      # 5. 部署 Greenplum 集群
      # -------------------------------------------------------------------------
      - name: Setup Greenplum 2-node cluster
        run: |
          echo "=== Deploying Greenplum Cluster ==="
          echo "Image: ${{ env.GREENPLUM_IMAGE }}"
          
          cd scripts/greenplum
          
          # 设置环境变量
          export GP_SEGMENTS=1
          export GP_MEMORY=2GB

          # 启动集群
          docker compose up -d

          echo "Greenplum cluster starting..."
          docker ps -a | grep gp_
      
      # -------------------------------------------------------------------------
      # 6. 等待 Greenplum 就绪
      # -------------------------------------------------------------------------
      - name: Wait for Greenplum
        run: |
          chmod +x scripts/greenplum/wait-for-greenplum.sh
          ./scripts/greenplum/wait-for-greenplum.sh
      
      # -------------------------------------------------------------------------
      # 7. 验证 Greenplum 集群状态
      # -------------------------------------------------------------------------
      - name: Verify Greenplum cluster
        run: |
          echo "=== Greenplum Version ==="
          docker exec ${{ env.GP_MASTER_CONTAINER }} su - ${{ env.GPADMIN_USER }} -c "psql -U ${{ env.GPADMIN_USER }} -d postgres -c 'SELECT version()'"
          
          echo "=== Cluster Configuration ==="
          docker exec ${{ env.GP_MASTER_CONTAINER }} su - ${{ env.GPADMIN_USER }} -c "psql -U ${{ env.GPADMIN_USER }} -d postgres -c 'SELECT * FROM gp_segment_configuration ORDER BY role, content'"
          
          echo "=== Database List ==="
          docker exec ${{ env.GP_MASTER_CONTAINER }} su - ${{ env.GPADMIN_USER }} -c "psql -U ${{ env.GPADMIN_USER }} -d postgres -c '\l'"
      
      # -------------------------------------------------------------------------
      # 8. 创建测试数据库
      # -------------------------------------------------------------------------
      - name: Create test database in Greenplum
        run: |
          echo "=== Creating test_db database ==="
          docker exec ${{ env.GP_MASTER_CONTAINER }} su - ${{ env.GPADMIN_USER }} -c "psql -U ${{ env.GPADMIN_USER }} -d postgres -c 'CREATE DATABASE test_db'"
          
          echo "=== Verifying connection ==="
          docker exec ${{ env.GP_MASTER_CONTAINER }} su - ${{ env.GPADMIN_USER }} -c "psql -U ${{ env.GPADMIN_USER }} -d test_db -c 'SELECT 1'"
      
      # -------------------------------------------------------------------------
      # 9. MySQL Schema 初始化
      # -------------------------------------------------------------------------
      - name: Setup test database schema in MySQL
        env:
          MYSQL_PWD: rootpassword
        run: |
          echo "=== Creating tables in MySQL ==="
          mysql -h 127.0.0.1 -u root test_db < scripts/mysql/create_table.sql
          
          echo "=== Creating indexes in MySQL ==="
          mysql -h 127.0.0.1 -u root test_db < scripts/mysql/create_index.sql
          
          echo "=== Creating views in MySQL ==="
          mysql -h 127.0.0.1 -u root test_db < scripts/mysql/create_view.sql
          
          echo "=== Creating functions in MySQL ==="
          mysql -h 127.0.0.1 -u root test_db < scripts/mysql/create_function.sql
          
          echo "=== Creating users in MySQL ==="
          mysql -h 127.0.0.1 -u root test_db < scripts/mysql/create_user.sql
          
          echo "=== Inserting test data ==="
          mysql -h 127.0.0.1 -u root test_db < scripts/mysql/insert_data.sql
      
          echo "=== Creating unique index in MySQL ===" 
          mysql -h 127.0.0.1 -u root test_db < scripts/mysql/create_unique_key_table.sql

          echo "=== Creating comments partition table in MySQL ==="
          mysql -h 127.0.0.1 -u root test_db < scripts/mysql/create_comments_partition_table.sql

      # -------------------------------------------------------------------------
      # 10. 创建 MySQL2PG 配置（MPP 模式）
      # -------------------------------------------------------------------------
      - name: Create MySQL2PG config (MPP mode enabled)
        run: |
          cat > config.yml << 'EOF'
          mysql:
            host: 127.0.0.1
            port: 3306
            username: root
            password: rootpassword
            database: test_db
            test_only: false
            max_open_conns: 50
            max_idle_conns: 25
            conn_max_lifetime: 3600
            connection_params: charset=utf8mb4&parseTime=false&interpolateParams=true

          postgresql:
            host: localhost
            port: 5432
            username: gpadmin
            password: ''
            database: test_db
            test_only: false
            max_conns: 25
            pg_connection_params: search_path=public connect_timeout=300 statement_timeout=0

          conversion:
            options:
              tableddl: true
              data: true
              view: false
              indexes: true
              functions: false
              users: false
              table_privileges: false
              lowercase_columns: true
              skip_existing_tables: false
              validate_data: true
              truncate_before_sync: false
              use_table_list: false
              table_list: []
              exclude_use_table_list: true
              exclude_table_list: [case_45_stored_generated,case_59_complex_generated]
              exclude_use_view_list: false
              exclude_view_list: []
              exclude_use_function_list: false
              exclude_function_list: []
            mpp:
              enabled: true
              database: greenplum
            limits:
              concurrency: 5
              bandwidth_mbps: 100
              max_ddl_per_batch: 10
              max_functions_per_batch: 5
              max_indexes_per_batch: 20
              max_users_per_batch: 10
              max_rows_per_batch: 10000
              batch_insert_size: 10000

          run:
            show_progress: true
            error_log_path: ./errors.log
            enable_file_logging: true
            log_file_path: ./conversion.log
            show_console_logs: true
            show_log_in_console: false
          EOF
      
      # -------------------------------------------------------------------------
      # 11. 运行 MySQL2PG 迁移
      # -------------------------------------------------------------------------
      - name: Run MySQL2PG
        run: |
          echo "=== Running MySQL2PG: MySQL → Greenplum ==="
          go build -o mysql2pg ./cmd/
          ./mysql2pg -c config.yml
      
      # -------------------------------------------------------------------------
      # 12. 验证迁移结果
      # -------------------------------------------------------------------------
      - name: Verify migration results
        run: |
          echo "=== Checking Table Distribution Keys ==="
          docker exec ${{ env.GP_MASTER_CONTAINER }} su - ${{ env.GPADMIN_USER }} -c "psql -U ${{ env.GPADMIN_USER }} -d test_db -c \"
            SELECT 
              c.relname as table_name,
              COALESCE(string_agg(a.attname, ', ' ORDER BY array_position(p.attrnums, a.attnum)), '[random]') as dist_key
            FROM pg_catalog.gp_distribution_policy p
            JOIN pg_catalog.pg_attribute a ON a.attrelid = p.localoid AND a.attnum = ANY(p.attrnums)
            JOIN pg_catalog.pg_class c ON c.oid = p.localoid
            JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind = 'r'
            GROUP BY c.relname, p.attrnums
            ORDER BY c.relname
            LIMIT 20;
          \""
          
          echo "=== Checking Row Counts ==="
          docker exec ${{ env.GP_MASTER_CONTAINER }} su - ${{ env.GPADMIN_USER }} -c "psql -U ${{ env.GPADMIN_USER }} -d test_db -c \"
            SELECT 
              c.relname as table_name,
              c.reltuples::bigint as row_count
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind = 'r'
            ORDER BY c.relname
            LIMIT 20;
          \""
          
          echo "=== Checking for UNIQUE INDEX (should be empty/skipped) ==="
          docker exec ${{ env.GP_MASTER_CONTAINER }} su - ${{ env.GPADMIN_USER }} -c "psql -U ${{ env.GPADMIN_USER }} -d test_db -c \"
            SELECT indexname, indexdef 
            FROM pg_indexes 
            WHERE schemaname = 'public' AND indexdef LIKE '%UNIQUE%'
            LIMIT 10;
          \"" || echo "No UNIQUE INDEX found (expected in Greenplum)"
          
          echo "=== Checking Indexes ==="
          docker exec ${{ env.GP_MASTER_CONTAINER }} su - ${{ env.GPADMIN_USER }} -c "psql -U ${{ env.GPADMIN_USER }} -d test_db -c \"
            SELECT indexname, indexdef 
            FROM pg_indexes 
            WHERE schemaname = 'public'
            LIMIT 20;
          \""
      
      # -------------------------------------------------------------------------
      # 13. 上传日志
      # -------------------------------------------------------------------------
      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-greenplum-${{ github.run_id }}
          path: |
            conversion.log
            errors.log
          retention-days: 30
      
      # -------------------------------------------------------------------------
      # 14. 清理 Greenplum 集群
      # -------------------------------------------------------------------------
      - name: Cleanup Greenplum cluster
        if: always()
        run: |
          echo "=== Cleaning up Greenplum cluster ==="
          cd scripts/greenplum
          docker compose down -v
          echo "Cleanup completed"
