# MySQL连接配置
mysql:
  host: localhost
  port: 3306
  username: root
  password: password
  database: test_db
  test_only: false           # 仅测试连接，不执行转换
  max_open_conns: 100        # 连接池配置的最大连接数，从50提升到100
  max_idle_conns: 50         # 连接池配置的最大空闲连接数，从20提升到50
  conn_max_lifetime: 3600    # 连接池配置的最大生命周期（秒）
  connection_params: charset=utf8mb4&parseTime=false&interpolateParams=true&readTimeout=60s&writeTimeout=60s&timeout=30s # MySQL连接参数
  consistent_snapshot: false # 数据读取使用一致性快照（源库并发写入时保证读到一致数据；要求 REPEATABLE READ 隔离级别）

# PostgreSQL连接配置
postgresql:
  host: localhost
  port: 5432
  username: postgres
  password: password
  database: test_db
  test_only: false  # 仅测试连接，不执行转换
  max_conns: 50     # 连接池配置的最大连接数，从20提升到50
  pg_connection_params: search_path=public connect_timeout=300 statement_timeout=0 # PostgreSQL连接参数
  password_encryption: auto  # 密码加密方式：md5, scram-sha-256, auto（默认）

# 转换配置
conversion:
  # 转换选项，按照以下参数顺序进行
  options:
    tableddl: true    # 转换表DDL
    data: true        # 转换数据（先转DDL后转数据）
    view: false         # 转换视图
    indexes: true     # 转换索引
    functions: false   # 转换函数
    users: true       # 转换用户
    table_privileges: true # 转换用户在表上的权限
    lowercase_columns: true     # 控制表字段是否需要转小写，true为转小写（默认值），false保持与MySQL字段一致
                                # 注意：视图 DDL 中的标识符（含视图名）始终整体转小写，
                                # 与本选项无关，字符串字面量内容不受影响（P2-13 约定）
    skip_existing_tables: true  # 如果表在PostgreSQL中已存在，true 为跳过，false 为创建
    validate_data: true         # 同步数据后验证数据一致性
    truncate_before_sync: false  # 同步前是否清空表数据
    use_table_list: false       # 是否使用指定的表列表进行数据同步，其他步骤不生效
    table_list: [table1]  # 指定要同步的表列表，当use_table_list为true时生效，格式为[table1,table2,...]
    exclude_use_table_list: false   # 是否使用跳过表列表，为true时不同步exclude_table_list中的表
    exclude_table_list: [table1]         # 要跳过的表列表，当exclude_use_table_list为true时生效
    exclude_use_view_list: false       # 是否使用视图排除列表
    exclude_view_list: [view1]         # 要跳过的视图列表，当exclude_use_view_list为true时生效
    exclude_use_function_list: false   # 是否使用函数排除列表
    exclude_function_list: [func1]     # 要跳过的函数列表，当exclude_use_function_list为true时生效

  # MPP 分布式数据库支持
  mpp:
    enabled: false              # 是否启用 MPP 模式（启用后才会创建 UNIQUE INDEX）
    database: auto              # MPP 数据库类型: greenplum/yugabyte/auto（自动检测）

  # 限制配置
  limits:
    concurrency: 10             # 并发数限制
    bandwidth_mbps: 100         # 网络带宽限制(Mbps)
    max_ddl_per_batch: 10       # 一次性转换DDL的个数限制
    max_functions_per_batch: 5  # 一次性转换function的个数限制
    max_indexes_per_batch: 20   # 一次性转换index的个数限制
    max_users_per_batch: 10     # 一次性转换用户的个数限制
    max_rows_per_batch: 50000   # 一次性同步数据的行数限制（宽表会按估算行宽自适应下调）
    batch_insert_size: 50000    # 批量插入的大小（建议与 max_rows_per_batch 保持一致）

# 运行配置
run:
  show_progress: true           # 显示任务进度
  error_log_path: ./errors.log  # 转换异常保存路径
  enable_file_logging: true     # 是否启用文件日志
  log_file_path: ./conversion.log  # 日志文件保存路径
  show_console_logs: true      # 是否在控制台显示日志信息
  show_log_in_console: false   # 是否在控制台显示Log日志输出